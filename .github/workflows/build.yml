          cat > RimasThemes/app/src/main/java/com/rimas/themes/Art.kt <<'EOF_11'
          package com.rimas.themes

          import android.content.Context
          import android.graphics.*
          import android.graphics.drawable.Drawable
          import android.view.View
          import android.widget.TextView
          import java.util.Random

          enum class Kind { WALL, ICON, CLOCK }

          fun Context.dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

          fun Context.label(text: String, size: Float, color: String, bold: Boolean): TextView {
              val t = TextView(this)
              t.text = text
              t.textSize = size
              t.setTextColor(Color.parseColor(color))
              if (bold) t.typeface = Typeface.DEFAULT_BOLD
              return t
          }

          fun drawCharacter(c: Canvas, cx: Float, cy: Float, size: Float, t: Theme) {
              val p = Paint(Paint.ANTI_ALIAS_FLAG)
              c.save()
              c.translate(cx - size / 2, cy - size / 2)
              val s = size / 60f
              c.scale(s, s)
              p.color = t.hair
              c.drawCircle(30f, 30f, 25f, p)
              p.color = Color.parseColor("#FFE6D5")
              c.drawCircle(30f, 35f, 18f, p)
              p.color = t.hair
              val bangs = Path()
              bangs.moveTo(11f, 33f)
              bangs.quadTo(14f, 6f, 30f, 6f)
              bangs.quadTo(46f, 6f, 49f, 33f)
              bangs.quadTo(42f, 19f, 30f, 22f)
              bangs.quadTo(18f, 19f, 11f, 33f)
              bangs.close()
              c.drawPath(bangs, p)
              p.color = Color.parseColor("#3A1F3D")
              c.drawOval(RectF(20f, 32.5f, 26f, 41.5f), p)
              c.drawOval(RectF(34f, 32.5f, 40f, 41.5f), p)
              p.color = Color.WHITE
              c.drawCircle(24f, 35.5f, 1.2f, p)
              c.drawCircle(38f, 35.5f, 1.2f, p)
              p.color = Color.parseColor("#99FF9EB5")
              c.drawCircle(17f, 42f, 3f, p)
              c.drawCircle(43f, 42f, 3f, p)
              p.style = Paint.Style.STROKE
              p.strokeWidth = 1.5f
              p.strokeCap = Paint.Cap.ROUND
              p.color = Color.parseColor("#C2185B")
              val mouth = Path()
              mouth.moveTo(27f, 44f)
              mouth.quadTo(30f, 47f, 33f, 44f)
              c.drawPath(mouth, p)
              p.style = Paint.Style.FILL
              p.color = t.bow
              c.save(); c.rotate(-25f, 45f, 12f); c.drawOval(RectF(39f, 8f, 51f, 16f), p); c.restore()
              c.save(); c.rotate(20f, 53f, 9f); c.drawOval(RectF(48f, 5.5f, 58f, 12.5f), p); c.restore()
              c.restore()
          }

          fun drawHeart(c: Canvas, x: Float, y: Float, s: Float, p: Paint) {
              val h = Path()
              h.moveTo(x, y + s * 0.9f)
              h.cubicTo(x - s * 1.4f, y - s * 0.1f, x - s * 0.7f, y - s * 1.1f, x, y - s * 0.4f)
              h.cubicTo(x + s * 0.7f, y - s * 1.1f, x + s * 1.4f, y - s * 0.1f, x, y + s * 0.9f)
              h.close()
              c.drawPath(h, p)
          }

          fun drawStar(c: Canvas, cx: Float, cy: Float, r: Float, p: Paint) {
              val path = Path()
              for (i in 0 until 10) {
                  val rad = if (i % 2 == 0) r else r * 0.45f
                  val ang = Math.toRadians((-90 + i * 36).toDouble())
                  val x = cx + (rad * Math.cos(ang)).toFloat()
                  val y = cy + (rad * Math.sin(ang)).toFloat()
                  if (i == 0) path.moveTo(x, y) else path.lineTo(x, y)
              }
              path.close()
              c.drawPath(path, p)
          }

          fun drawTileBg(c: Canvas, x: Float, y: Float, s: Float, t: Theme) {
              val p = Paint(Paint.ANTI_ALIAS_FLAG)
              val r = RectF(x + s * 0.03f, y + s * 0.03f, x + s * 0.97f, y + s * 0.97f)
              p.shader = LinearGradient(x, y, x + s, y + s, t.a, t.b, Shader.TileMode.CLAMP)
              c.drawRoundRect(r, s * 0.28f, s * 0.28f, p)
              p.shader = null
              p.style = Paint.Style.STROKE
              p.strokeWidth = s * 0.04f
              p.color = t.icon
              c.drawRoundRect(r, s * 0.28f, s * 0.28f, p)
          }

          fun drawGlyph(c: Canvas, cx: Float, cy: Float, s: Float, g: Int, t: Theme) {
              val p = Paint(Paint.ANTI_ALIAS_FLAG)
              p.color = t.icon
              when (g) {
                  0 -> drawHeart(c, cx, cy, s * 0.2f, p)
                  1 -> drawStar(c, cx, cy, s * 0.26f, p)
                  2 -> {
                      for (k in 0 until 5) {
                          val ang = Math.toRadians((k * 72 - 90).toDouble())
                          c.drawCircle(cx + (Math.cos(ang) * s * 0.14).toFloat(), cy + (Math.sin(ang) * s * 0.14).toFloat(), s * 0.1f, p)
                      }
                      p.color = Color.WHITE
                      c.drawCircle(cx, cy, s * 0.07f, p)
                  }
                  else -> drawCharacter(c, cx, cy, s * 0.8f, t)
              }
          }

          fun makeIcon(app: Drawable, t: Theme): Bitmap {
              val s = 192
              val bmp = Bitmap.createBitmap(s, s, Bitmap.Config.ARGB_8888)
              val c = Canvas(bmp)
              drawTileBg(c, 0f, 0f, s.toFloat(), t)
              val inner = (s * 0.56f).toInt()
              val l = (s - inner) / 2
              app.setBounds(l, l, l + inner, l + inner)
              app.draw(c)
              val p = Paint(Paint.ANTI_ALIAS_FLAG)
              p.color = t.icon
              drawHeart(c, s * 0.82f, s * 0.2f, s * 0.09f, p)
              return bmp
          }

          fun drawWallpaper(c: Canvas, w: Float, h: Float, t: Theme) {
              val p = Paint(Paint.ANTI_ALIAS_FLAG)
              p.shader = LinearGradient(0f, 0f, w * 0.5f, h, t.a, t.b, Shader.TileMode.CLAMP)
              c.drawRect(0f, 0f, w, h, p)
              p.shader = null
              p.color = Color.argb(90, 255, 255, 255)
              val r = Random(t.name.hashCode().toLong())
              for (i in 0 until 26) {
                  drawHeart(c, r.nextFloat() * w, r.nextFloat() * h, w * (0.03f + r.nextFloat() * 0.05f), p)
              }
              p.color = Color.argb(110, 255, 255, 255)
              c.drawCircle(w / 2, h * 0.55f, w * 0.36f, p)
              drawCharacter(c, w / 2, h * 0.55f, w * 0.62f, t)
          }

          fun drawClockBg(c: Canvas, w: Float, h: Float, t: Theme) {
              val p = Paint(Paint.ANTI_ALIAS_FLAG)
              val clip = Path()
              val rad = h * 0.26f
              clip.addRoundRect(RectF(0f, 0f, w, h), rad, rad, Path.Direction.CW)
              c.save()
              c.clipPath(clip)
              p.shader = LinearGradient(0f, 0f, w, h, t.a, t.b, Shader.TileMode.CLAMP)
              c.drawRect(0f, 0f, w, h, p)
              p.shader = null
              p.color = Color.argb(90, 255, 255, 255)
              val r = Random(t.name.hashCode().toLong() + 1)
              for (i in 0 until 10) {
                  drawHeart(c, r.nextFloat() * w, r.nextFloat() * h, h * (0.05f + r.nextFloat() * 0.07f), p)
              }
              p.color = Color.argb(110, 255, 255, 255)
              c.drawCircle(h * 0.62f, h * 0.5f, h * 0.42f, p)
              drawCharacter(c, h * 0.62f, h * 0.5f, h * 0.78f, t)
              c.restore()
          }

          class PreviewView(ctx: Context, val t: Theme, val kind: Kind) : View(ctx) {
              override fun onMeasure(wm: Int, hm: Int) {
                  val w = MeasureSpec.getSize(wm)
                  val aspect = when (kind) {
                      Kind.WALL -> 1.9f
                      Kind.ICON -> 1.0f
                      Kind.CLOCK -> 0.45f
                  }
                  setMeasuredDimension(w, (w * aspect).toInt())
              }

              override fun onDraw(c: Canvas) {
                  val w = width.toFloat()
                  val h = height.toFloat()
                  val p = Paint(Paint.ANTI_ALIAS_FLAG)
                  when (kind) {
                      Kind.WALL -> {
                          val clip = Path()
                          clip.addRoundRect(RectF(0f, 0f, w, h), w * 0.1f, w * 0.1f, Path.Direction.CW)
                          c.save()
                          c.clipPath(clip)
                          drawWallpaper(c, w, h, t)
                          c.restore()
                      }
                      Kind.ICON -> {
                          p.color = Color.WHITE
                          c.drawRoundRect(RectF(0f, 0f, w, h), w * 0.1f, w * 0.1f, p)
                          val s = w * 0.38f
                          val gap = w * 0.06f
                          val x0 = (w - 2 * s - gap) / 2
                          for (i in 0 until 4) {
                              val x = x0 + (i % 2) * (s + gap)
                              val y = x0 + (i / 2) * (s + gap)
                              drawTileBg(c, x, y, s, t)
                              drawGlyph(c, x + s / 2, y + s / 2, s, i, t)
                          }
                      }
                      Kind.CLOCK -> {
                          drawClockBg(c, w, h, t)
                          p.color = t.ink
                          p.typeface = Typeface.DEFAULT_BOLD
                          p.textAlign = Paint.Align.RIGHT
                          p.textSize = h * 0.42f
                          c.drawText("10:09", w - w * 0.06f, h * 0.58f, p)
                      }
                  }
              }
          }
          EOF_11
          mkdir -p RimasThemes/app/src/main/java/com/rimas/themes
          cat > RimasThemes/app/src/main/java/com/rimas/themes/MainActivity.kt <<'EOF_12'
          package com.rimas.themes

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.widget.LinearLayout
          import android.widget.ScrollView

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.decorView.layoutDirection = View.LAYOUT_DIRECTION_RTL
                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(dp(18), dp(40), dp(18), dp(24))
                  val title = label("♥ ثيمات الاميره ريماس", 26f, "#C2185B", true)
                  title.setPadding(0, 0, 0, dp(4))
                  root.addView(title)
                  val sub = label("اختاري القسم: خلفيات أو أيقونات أو ساعات", 14f, "#5B3A5E", false)
                  sub.setPadding(0, 0, 0, dp(18))
                  root.addView(sub)

                  val names = listOf("الخلفيات", "الأيقونات", "الساعات")
                  val descs = listOf(
                      "20 خلفية بشخصيات أنمي، تطبقها على الرئيسية أو القفل",
                      "غيّر شكل أيقونات تطبيقاتك بثيمات زاهية",
                      "ويدجت ساعة بتصاميم مختلفة تضيفها لشاشتك"
                  )
                  val kinds = listOf(Kind.WALL, Kind.ICON, Kind.CLOCK)
                  val themeIdx = listOf(0, 2, 9)
                  val widths = listOf(90, 110, 150)
                  for (i in 0 until 3) {
                      val card = LinearLayout(this)
                      card.orientation = LinearLayout.HORIZONTAL
                      card.gravity = Gravity.CENTER_VERTICAL
                      card.setPadding(dp(16), dp(16), dp(16), dp(16))
                      val bg = GradientDrawable()
                      bg.setColor(Color.WHITE)
                      bg.cornerRadius = dp(22).toFloat()
                      bg.setStroke(dp(2), Color.parseColor("#FFC1D9"))
                      card.background = bg
                      card.addView(PreviewView(this, THEMES[themeIdx[i]], kinds[i]), LinearLayout.LayoutParams(dp(widths[i]), LinearLayout.LayoutParams.WRAP_CONTENT))
                      val txt = LinearLayout(this)
                      txt.orientation = LinearLayout.VERTICAL
                      txt.setPadding(dp(14), 0, dp(14), 0)
                      txt.addView(label(names[i], 20f, "#C2185B", true))
                      txt.addView(label(descs[i], 13f, "#5B3A5E", false))
                      card.addView(txt, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                      card.setOnClickListener {
                          startActivity(Intent(this, CategoryActivity::class.java).putExtra("k", i))
                      }
                      val lp = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                      lp.setMargins(0, 0, 0, dp(16))
                      root.addView(card, lp)
                  }
                  val sv = ScrollView(this)
                  sv.setBackgroundColor(Color.parseColor("#FFF5FA"))
                  sv.addView(root)
                  setContentView(sv)
              }
          }
