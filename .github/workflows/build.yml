                  try {
                      val dm = resources.displayMetrics
                      val bmp = Bitmap.createBitmap(dm.widthPixels, dm.heightPixels, Bitmap.Config.ARGB_8888)
                      drawWallpaper(Canvas(bmp), dm.widthPixels.toFloat(), dm.heightPixels.toFloat(), theme0)
                      WallpaperManager.getInstance(this).setBitmap(bmp, null, true, flag)
                      Toast.makeText(this, "تم التطبيق ♥", Toast.LENGTH_SHORT).show()
                  } catch (e: Exception) {
                      Toast.makeText(this, "تعذر التطبيق", Toast.LENGTH_SHORT).show()
                  }
              }
