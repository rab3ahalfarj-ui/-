          package com.rimas.themes

          import android.app.Activity
          import android.content.Intent
          import android.content.pm.ResolveInfo
          import android.content.pm.ShortcutInfo
          import android.content.pm.ShortcutManager
          import android.graphics.Color
          import android.graphics.drawable.Icon
          import android.os.Build
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.BaseAdapter
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ListView
          import android.widget.Toast

          class AppPickerActivity : Activity() {
              private lateinit var theme0: Theme

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.decorView.layoutDirection = View.LAYOUT_DIRECTION_RTL
                  theme0 = THEMES[intent.getIntExtra("i", 0)]
                  val pm = packageManager
                  val main = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  val apps = pm.queryIntentActivities(main, 0)
                      .filter { it.activityInfo.packageName != packageName }
                      .sortedBy { it.loadLabel(pm).toString().lowercase() }

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setBackgroundColor(Color.parseColor("#FFF5FA"))
                  root.setPadding(dp(14), dp(40), dp(14), dp(8))
                  root.addView(label("♥ " + theme0.name, 24f, "#C2185B", true))
                  val sub = label("اضغطي على التطبيق لإضافة أيقونته بهذا الثيم للشاشة الرئيسية", 14f, "#5B3A5E", false)
                  sub.setPadding(0, dp(4), 0, dp(12))
                  root.addView(sub)

                  val list = ListView(this)
                  list.adapter = object : BaseAdapter() {
                      override fun getCount(): Int = apps.size
                      override fun getItem(position: Int): Any = apps[position]
                      override fun getItemId(position: Int): Long = position.toLong()
                      override fun getView(position: Int, convertView: View?, parent: ViewGroup?): View {
                          val ri = apps[position]
                          val row = LinearLayout(this@AppPickerActivity)
                          row.orientation = LinearLayout.HORIZONTAL
                          row.gravity = Gravity.CENTER_VERTICAL
                          row.setPadding(dp(8), dp(8), dp(8), dp(8))
                          val iv = ImageView(this@AppPickerActivity)
                          iv.setImageDrawable(ri.loadIcon(pm))
                          row.addView(iv, LinearLayout.LayoutParams(dp(44), dp(44)))
                          val tv = label(ri.loadLabel(pm).toString(), 16f, "#3A1F3D", false)
                          tv.setPadding(dp(12), 0, dp(12), 0)
                          row.addView(tv)
                          return row
                      }
                  }
                  list.setOnItemClickListener { _, _, pos, _ -> pin(apps[pos]) }
                  root.addView(list, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f))
                  setContentView(root)
              }

              private fun pin(ri: ResolveInfo) {
                  if (Build.VERSION.SDK_INT < 26) {
                      Toast.makeText(this, "هذي الميزة تحتاج أندرويد 8 أو أحدث", Toast.LENGTH_LONG).show()
                      return
                  }
                  val sm = getSystemService(ShortcutManager::class.java)
                  if (sm == null || !sm.isRequestPinShortcutSupported) {
                      Toast.makeText(this, "الشاشة الرئيسية الحالية ما تدعم إضافة الاختصارات", Toast.LENGTH_LONG).show()
                      return
                  }
                  val pkg = ri.activityInfo.packageName
                  val launch = packageManager.getLaunchIntentForPackage(pkg)
                  if (launch == null) {
                      Toast.makeText(this, "تعذر فتح التطبيق", Toast.LENGTH_SHORT).show()
                      return
                  }
                  val bmp = makeIcon(ri.loadIcon(packageManager), theme0)
                  val info = ShortcutInfo.Builder(this, "r_" + pkg + "_" + System.currentTimeMillis())
                      .setShortLabel(ri.loadLabel(packageManager))
                      .setIcon(Icon.createWithBitmap(bmp))
                      .setIntent(launch)
                      .build()
                  sm.requestPinShortcut(info, null)
              }
          }
