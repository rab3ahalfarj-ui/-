          package com.rimas.themes

          import android.app.Activity
          import android.appwidget.AppWidgetManager
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.os.Build
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.Toast

          class CategoryActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.decorView.layoutDirection = View.LAYOUT_DIRECTION_RTL
                  val kind = Kind.values()[intent.getIntExtra("k", 0)]
                  val cols = when (kind) {
                      Kind.WALL -> 3
                      Kind.ICON -> 2
                      Kind.CLOCK -> 1
                  }
                  val head = when (kind) {
                      Kind.WALL -> "♥ الخلفيات"
                      Kind.ICON -> "♥ الأيقونات"
                      Kind.CLOCK -> "♥ الساعات"
                  }
                  val desc = when (kind) {
                      Kind.WALL -> "اضغطي على خلفية لتطبيقها"
                      Kind.ICON -> "اختاري ثيم، ثم اختاري التطبيق اللي تبين تغيرين أيقونته وتنضاف على الشاشة الرئيسية"
                      Kind.CLOCK -> "اضغطي على ساعة لإضافتها كويدجت على الشاشة الرئيسية"
                  }
                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(dp(12), dp(40), dp(12), dp(24))
                  val title = label(head, 26f, "#C2185B", true)
                  title.setPadding(dp(6), 0, dp(6), dp(4))
                  root.addView(title)
                  val sub = label(desc, 14f, "#5B3A5E", false)
                  sub.setPadding(dp(6), 0, dp(6), dp(16))
                  root.addView(sub)

                  for (chunk in THEMES.chunked(cols)) {
                      val row = LinearLayout(this)
                      row.orientation = LinearLayout.HORIZONTAL
                      for (t in chunk) {
                          val card = LinearLayout(this)
                          card.orientation = LinearLayout.VERTICAL
                          card.addView(PreviewView(this, t, kind))
                          val n = label(t.name, 14f, "#3A1F3D", true)
                          n.gravity = Gravity.CENTER
                          n.setPadding(0, dp(6), 0, 0)
                          card.addView(n)
                          val idx = THEMES.indexOf(t)
                          card.setOnClickListener { onPick(kind, idx) }
                          val lp = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                          lp.setMargins(dp(5), 0, dp(5), dp(16))
                          row.addView(card, lp)
                      }
                      for (k in 0 until (cols - chunk.size)) {
                          row.addView(View(this), LinearLayout.LayoutParams(0, 1, 1f))
                      }
                      root.addView(row)
                  }
                  val sv = ScrollView(this)
                  sv.setBackgroundColor(Color.parseColor("#FFF5FA"))
                  sv.addView(root)
                  setContentView(sv)
              }

              private fun onPick(kind: Kind, idx: Int) {
                  when (kind) {
                      Kind.WALL -> startActivity(Intent(this, DetailActivity::class.java).putExtra("i", idx))
                      Kind.ICON -> startActivity(Intent(this, AppPickerActivity::class.java).putExtra("i", idx))
                      Kind.CLOCK -> addClock(idx)
                  }
              }

              private fun addClock(idx: Int) {
                  getSharedPreferences("rimas", Context.MODE_PRIVATE).edit().putInt("default_clock", idx).apply()
                  val mgr = AppWidgetManager.getInstance(this)
                  if (Build.VERSION.SDK_INT >= 26 && mgr.isRequestPinAppWidgetSupported) {
                      mgr.requestPinAppWidget(ComponentName(this, ClockWidget::class.java), null, null)
                  } else {
                      Toast.makeText(this, "اضغطي مطولاً على الشاشة الرئيسية ثم الويدجت ثم ساعة ريماس", Toast.LENGTH_LONG).show()
                  }
              }
          }
