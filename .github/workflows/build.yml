          package com.rimas.themes

          import android.graphics.Color

          private fun lum(c: Int): Double =
              (0.299 * Color.red(c) + 0.587 * Color.green(c) + 0.114 * Color.blue(c)) / 255.0

          class Theme(val name: String, ca: String, cb: String, ci: String, ch: String, cbow: String) {
              val a = Color.parseColor(ca)
              val b = Color.parseColor(cb)
              val icon = Color.parseColor(ci)
              val hair = Color.parseColor(ch)
              val bow = Color.parseColor(cbow)
              val ink = if ((lum(a) + lum(b)) / 2 > 0.55) Color.parseColor("#3A1F3D") else Color.WHITE
          }

          val THEMES = listOf(
              Theme("ريماس الوردي", "#FFC1D9", "#FFE9F2", "#F06292", "#6B3F4F", "#FF4F8B"),
              Theme("ريبون الساتان", "#F8BBD0", "#FCE4EC", "#D81B60", "#2B1B2E", "#FF80AB"),
              Theme("لافندر حالم", "#CDB8FF", "#EFE7FF", "#7E57C2", "#3B2A66", "#B388FF"),
              Theme("نعناع كاواي", "#A8F0DA", "#E3FCF4", "#26A69A", "#2E4A4A", "#FF8FB1"),
              Theme("سماء باستيل", "#A9D6FF", "#E6F4FF", "#42A5F5", "#1F3A66", "#FFB3D1"),
              Theme("فراولة", "#FF8FA8", "#FFD6DF", "#E53958", "#4A1F2A", "#FFFFFF"),
              Theme("ليمون مشمس", "#FFE66D", "#FFF8CC", "#F2A900", "#5A3E1B", "#FF7AA8"),
              Theme("توت بنفسجي", "#D58CFF", "#F6D8FF", "#A21CAF", "#2A1038", "#FFD84D"),
              Theme("مرجان الغروب", "#FF9E8F", "#FFD9B8", "#F4623A", "#5C2A1F", "#FFF1A6"),
              Theme("بحر فيروزي", "#5CE1D6", "#C4F8F3", "#00897B", "#12383A", "#FF9ECF"),
              Theme("ليلة النجوم", "#8E7CFF", "#CBB8FF", "#4527A0", "#E8E0FF", "#FFD54F"),
              Theme("ورد جوري", "#F06292", "#FFB3CC", "#AD1457", "#3D1020", "#FFFFFF"),
              Theme("كراميل حلو", "#FFC48C", "#FFE8CC", "#C77721", "#4A2F1B", "#FF8A80"),
              Theme("ربيع أخضر", "#B6EE7C", "#EAFCCB", "#4CAF50", "#2F4A1F", "#FF9ECF"),
              Theme("غيمة قطن", "#FFC8DD", "#BDE0FE", "#7C8CF8", "#4A3F6B", "#FF80AB"),
              Theme("أرجواني ملكي", "#B05EEA", "#E8C2FF", "#6A1B9A", "#1E0F2E", "#FFD54F"),
              Theme("شمام", "#FFB997", "#FFE5D4", "#F57C4A", "#5A2F1F", "#8BD3C7"),
              Theme("أزرق ثلجي", "#7CC4FF", "#EAF6FF", "#1E88E5", "#9FB4E8", "#3F7FD6"),
              Theme("عنابي لامع", "#E94B78", "#FFA3BC", "#B3123F", "#2B0A14", "#FFFFFF"),
              Theme("قوس قزح", "#FFADAD", "#9BF6FF", "#B26BFF", "#FF8FB1", "#FFD84D")
          )
