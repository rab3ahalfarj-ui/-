          package com.rimas.themes

          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.widget.RemoteViews

          class ClockWidget : AppWidgetProvider() {
              override fun onUpdate(context: Context, mgr: AppWidgetManager, ids: IntArray) {
                  val prefs = context.getSharedPreferences("rimas", Context.MODE_PRIVATE)
                  for (id in ids) {
                      val idx = prefs.getInt("w" + id, prefs.getInt("default_clock", 0))
                      prefs.edit().putInt("w" + id, idx).apply()
                      mgr.updateAppWidget(id, build(context, idx))
                  }
              }

              override fun onDeleted(context: Context, ids: IntArray) {
                  val e = context.getSharedPreferences("rimas", Context.MODE_PRIVATE).edit()
                  for (id in ids) e.remove("w" + id)
                  e.apply()
              }

              companion object {
                  fun build(context: Context, idx: Int): RemoteViews {
                      val t = THEMES[idx]
                      val bmp = Bitmap.createBitmap(640, 280, Bitmap.Config.ARGB_8888)
                      drawClockBg(Canvas(bmp), 640f, 280f, t)
                      val rv = RemoteViews(context.packageName, R.layout.widget_clock)
                      rv.setImageViewBitmap(R.id.bg, bmp)
                      rv.setTextColor(R.id.time, t.ink)
                      rv.setTextColor(R.id.date, t.ink)
                      return rv
                  }
              }
          }
